name: "Build and Publish Release"
description: "Build release binaries and upload to GitHub Release"

inputs:
  github-token:
    description: "GitHub Token for release creation"
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: build
      shell: bash
      run: bash "${{ github.action_path }}/build.sh"

    - name: Attest Build Provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 #v4.2.2
      with:
        subject-path: 'dist/*'

    - name: publish
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: bash "${{ github.action_path }}/publish.sh"