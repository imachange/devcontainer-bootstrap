name: "Setup and Test"
description: "Checkout, setup Go, run vet and test"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - shell: bash
      run: go vet ./...
    - shell: bash
      run: go test ./...