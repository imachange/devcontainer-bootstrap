name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
      - uses: ./.github/actions/setup-and-test
      - uses: ./.github/actions/build-and-publish
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
